version: 2

models:
  - name: dim_date
    description: Date dimension spanning all observed activity.
    columns:
      - name: date
        data_tests: [unique, not_null]

  - name: dim_repository
    description: Repository dimension.
    columns:
      - name: repository_key
        data_tests: [unique, not_null]
      - name: github_repository_id
        data_tests: [unique, not_null]

  - name: fct_commits
    description: Commit fact grain — one row per commit.
    columns:
      - name: commit_key
        data_tests: [unique, not_null]
      - name: commit_id
        data_tests: [unique, not_null]
      - name: repository_key
        data_tests:
          - relationships:
              to: ref('dim_repository')
              field: repository_key

  - name: fct_calendar_events
    description: Calendar event fact grain — one row per event.
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: calendar_event_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              values: ['work', 'personal', 'learning', 'meeting', 'other']

  - name: fct_pull_requests
    description: Pull request fact grain — one row per pull request.
    columns:
      - name: pr_key
        data_tests: [unique, not_null]
      - name: repository_key
        data_tests:
          - relationships:
              to: ref('dim_repository')
              field: repository_key
      - name: state
        data_tests:
          - accepted_values:
              values: ['open', 'closed']

  - name: fct_issues
    description: Issue fact grain — one row per issue.
    columns:
      - name: issue_key
        data_tests: [unique, not_null]
      - name: repository_key
        data_tests:
          - relationships:
              to: ref('dim_repository')
              field: repository_key
      - name: state
        data_tests:
          - accepted_values:
              values: ['open', 'closed']

  - name: fct_email_messages
    description: Email message fact grain — one row per Gmail message, metadata only (spec §23).
    columns:
      - name: message_key
        data_tests: [unique, not_null]

  - name: fct_spotify_plays
    description: Spotify play fact grain — one row per recently-played track play.
    columns:
      - name: play_key
        data_tests: [unique, not_null]

  - name: mart_daily_activity
    description: One row per date with commit and meeting aggregates.
    columns:
      - name: date
        data_tests: [unique, not_null]

  - name: mart_project_activity
    description: Per-project activity and active/stale/inactive status.
    columns:
      - name: repository_key
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['active', 'stale', 'inactive']

  - name: mart_monthly_summary
    description: Month-over-month activity summary.
    columns:
      - name: month
        data_tests: [unique, not_null]